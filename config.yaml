# ============================================================
#  historical_story_gen  配置文件
#  历史小故事 → DeepSeek 写稿 → TTS 配音 → 配图 + 字幕 → 成片
#  所有可调参数集中在这里，改完直接生效，无需改代码
# ============================================================

# ---------- 1. 故事结构 / 时长 ----------
story:
  # ---- 切入方式（内容视角）----
  #   small  小切口（默认）：整期只回答一个具体的日常问题，再用史实把答案讲成故事。
  #          例：「流放三千里：被流放的人一路上靠什么活下来？」
  #              「城破那一天：官员、商人、僧人、工匠各自的结局」
  #              「官员出差：从京城到广州，走多久、住哪儿、路上花多少钱？」
  #          —— 选题池、大纲、写稿、史实审校的提示词都跟着切到这个模式。
  #   event  事件式（旧行为）：直接讲一场战役 / 一次变法的来龙去脉。
  angle_mode: "small"
  # 自己制定的选题条目（两级：类型 + 标题与描述）。用 scripts\add_topic.py 增删，
  # 不用改代码；它会被并进选题池，自动选题/按类型过滤/避开最近类型/查重都生效。
  user_topics: "data/topics_user.json"
  # 目标总时长（秒）。需求是 5-10 分钟，默认 7 分钟（居中）。
  target_total_seconds: 420
  # 硬性区间：成片语音总时长必须落在这个范围内，超了会自适应改写
  min_total_seconds: 300      # 5 分钟
  max_total_seconds: 600      # 10 分钟
  # 语速换算：中文播报实测值。★ 换音色或改语速后必须重新校准这个数字。
  #
  # 当前值来源（2026-09-15，系统音色 audiobook_male_1 / speed=1.1）：
  #   从已生成期的脚本反算（脚本里逐分镜记了字数与实测时长），
  #   且**先用音频缓存 key 验证过音色语速**，只统计同一音色的段：
  #     72 段 / 8933 字 / 1900.0 秒 = 4.70 字/秒（逐段中位数 4.74，范围 3.93–5.49）
  #   复算：python scripts\calib_rate.py
  #   probe-tts 连续范文给的是 4.77 —— 偏快，不要直接拿它当值。
  #
  # ★ 校准必须按音色分组，不同音色不能混着平均（踩过的坑）：
  #   上一版这里的值是 4.59，多算了「白银、鸦片与钦差」那一期（4.14 字/秒）。
  #   那期的音色用音频缓存 key 反查**任何候选都没命中**（metadata 没记 tts_spec，
  #   2026-09-14 之前都不记），说明它根本不是 audiobook_male_1 录的 —— 是别的音色，
  #   混进来把值拉低了 2%。calib_rate.py 现在会自动排除这类期并标注。
  #   音色之间差得很远：克隆音色 hsg_story_v2 @1.1 只有 3.45 字/秒（慢 36%），
  #   拿错音色的值去估时长，清单里的片段长度就全错了。
  #
  # 为什么不用 probe-tts 的连续范文值：流水线是**按分镜**逐段合成的，
  #   每段都带 TTS 的首尾静音，实际产出比连续范文慢一截
  #   （克隆音色那次实测：范文 3.91 / 流水线实际 3.45）。
  #   用偏快的值写稿会偏长，容易顶到区间上限并多触发一轮自适应改写。
  #
  # 历史实测（留档）：
  #   audiobook_male_1 / 1.0               → 范文 227 字 55.19 秒 = 4.11 字/秒
  #   克隆音色 hsg_story_v2 / 1.1（已弃用） → 范文 3.91、流水线实际 3.45 字/秒
  #   （对比：male-qn-jingying 资讯播报音色 1.05 速约 4.6-4.8 字/秒；
  #     有声书音色更慢更有停顿感，适合讲故事）
  chars_per_second: 4.70
  # 章节数 + 每章目标时长（秒）
  # ★ 时长主要靠这两个旋钮；target_total_seconds 只用来算比例和打日志
  chapters: 6
  seconds_per_chapter: 68
  # 每个「分镜」的目标时长（秒）。一个分镜 = 一张图 + 一段字幕 + 一段语音
  # 分镜越短画面切换越快，20-25 秒是比较耐看的节奏
  seconds_per_scene: 22
  # 片头口播（片尾画面的开关在 video.outro）
  intro_speak: true
  intro_seconds_pad: 1.2
  # 片尾卡片：时长 + 文案
  outro_seconds: 4.0
  outro_title: "本期故事讲完了，我们下期再见"
  # 章节标题是否需要 LLM 起（关掉则用「第一章」这种机械编号）
  chapter_headings: true

# ---------- 2. 素材（可选，用作史实锚点）----------
# 注意：维基百科 / Wikimedia Commons 在国内不可访问（实测超时），
#       百度百科有人机校验（实测 403），所以素材源用 Bing 检索摘要。
#       摘要偏杂，只作为「人名/年份的参考锚点」，不强制模型照抄。
material:
  enabled: true
  provider: "bing"          # bing | none
  max_queries: 6            # 最多发几路检索（话题 + 章节要点）
  snippets_per_query: 8
  timeout: 20
  # 素材里出现这些站点名会被丢掉（游戏站、诗文站对历史叙事是噪声）
  drop_if_contains: ["游戏", "新服", "客户端", "攻略", "手游", "下载", "官网"]

# ---------- 3. 文本大模型（写稿）----------
# ⚠️ 已锁定：文本内容只用 DeepSeek，MiniMax 只允许用于语音合成。
#    锁是硬性的（src/hsg/config.py 的 TEXT_PROVIDER_LOCK + assert_text_provider）：
#    把下面 provider 改成别的，启动时直接报错，不会悄悄换掉文本模型。
#    CLI 的 --provider 也只接受 deepseek。
llm:
  provider: "deepseek"          # 已锁定，改这里无效
  max_tokens: 8192
  max_tokens_cap: 32768
  timeout: 180
  # 写稿温度：历史叙事要稳，别太放飞
  outline_temperature: 0.6
  writer_temperature: 0.65
  # 并发写稿（按章节并行）
  concurrency: 4
  deepseek:
    base_url: "https://api.deepseek.com"
    model: "deepseek-chat"
  # ---- 以下两段保留但不生效（文本模型已锁定 deepseek）----
  minimax:
    base_url: "https://api.minimaxi.com/v1"
    model: "MiniMax-M2.7-highspeed"
  aliyun:
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen3.7-max"

# ---------- 4. 史实校验 ----------
verify:
  # 程序化：年份是否落在故事所处的年代区间内（超出的会被点名）
  year_range_check: true
  # 程序化：同一个人名在全文里的写法是否一致
  # ⚠️ 默认关闭：中文没有词边界，n-gram 粗抽专名会大量跨词切分产生误报
  #    （实测第一次跑出 16 条全是误报）。这项检查交给 llm_audit 做更准。
  name_consistency_check: false
  # LLM 审校：让模型以「史实校对员」身份逐条挑错（年份/人名/地名/事件因果）
  llm_audit: true
  # ---- 写稿前的「锚点核查」----
  # 小切口题材靠具体史实撑，模型会顺手编一个看起来合理的出处
  # （实跑出现过「《户部则例》记载递解人犯每日给米一升」这种查无此条的引用）。
  # 这道闸门在写稿之前逐条核查大纲给的史实锚点：
  #   ok     保留
  #   unsure 降级标注 —— 写稿时只能说「史料记载不一 / 没明确规定」
  #   wrong  直接删掉
  fact_audit: true
  # ---- 出片前的复检闸门 ----
  # 审校发现问题会带纠正意见重写章节，但「重写之后有没有真的改好」必须再验一遍。
  # 复检仍有必修问题时：
  #   block_on_fail: false（默认）→ 照常出片，但把未解决项写进稿件的
  #                                 「待人工核对」清单，并在日志里显著提示
  #   block_on_fail: true         → 直接中止（退出码 3），不出片
  # 建议：自己看的片子用 false（不完全阻断）；要发布的用 true。
  block_on_fail: false

# ---------- 5. 语音合成（TTS）----------
tts:
  provider: "minimax"
  minimax:
    base_url: "https://api.minimaxi.com/v1"
    # speech-2.6-hd 音质最好；speech-02-turbo 更快更便宜
    model: "speech-2.6-hd"
    # 讲故事的音色。audiobook_male_1 是「有声书」男声，比资讯播报音色更耐听。
    # ---- 2026-09-14 换回系统默认音色 ----
    # 中间试过克隆音色 hsg_story_v2（用 data/base_voice/api-response_2.mp3 经
    # MiniMax voice_clone 克隆），听感不佳，用户决定换回系统音色 audiobook_male_1。
    # 克隆流程本身是好的，想再试：python scripts/clone_voice.py --voice-id hsg_story_v2
    # 再把它填回下面一行即可。
    # ⚠️ 换音色后 story.chars_per_second 必须重新校准：跑 `python scripts\calib_rate.py`
    #    （**别用 probe-tts**：那是连续范文，比流水线的分镜合成快一截）。
    #    音频缓存 key = 文本 + 音色 + 语速，换音色不会静默复用旧语音，但时长估算会失准。
    voice_id: "audiobook_male_1"
    # 历史叙事语速放慢一点，1.0 为标准
    # 2026-09-14 从 1.0 提到 1.1；换回系统音色后仍保持 1.1（用户指定）
    # ⚠️ 改语速会同时改掉两样东西：
    #   ① 音频缓存 key（audio_tag 含语速）→ 旧语音不会被复用，会重新合成，这是对的
    #   ② 字/秒换算失效 → 必须重跑 `python scripts\calib_rate.py` 校准
    #      story.chars_per_second（别用 probe-tts 的范文值）
    speed: 1.1
    vol: 1.0
    pitch: 0
    sample_rate: 32000
    bitrate: 128000
    format: "mp3"
    language_boost: "Chinese"
  # 兜底：minimax 失败时回退到免费的 edge-tts（需要 pip install edge-tts）
  # ⚠️ 实测教训：兜底代码写了但没装 edge-tts，等于没有兜底 —— MiniMax 一欠费，
  #    18 段语音全灭（2026-09-11 真踩过）。装好之后 `--tts-provider edge` 可以直接
  #    用免费语音跑通全流程（不做发布时当试音/验证用）。
  fallback_edge_tts: true
  edge_voice: "zh-CN-YunxiNeural"
  # edge-tts（免费）独立配置：--tts-provider edge 时读这里
  # 常见音色：zh-CN-YunxiNeural（男·青年）、zh-CN-YunjianNeural（男·浑厚）、
  #          zh-CN-XiaoxiaoNeural（女·通用）
  edge:
    voice_id: "zh-CN-YunxiNeural"
    speed: 1.0
  timeout: 180
  concurrency: 4
  # 合成粒度固定按分镜（scene）：一段文字 = 一段语音 = 一张图 = 一片字幕，
  # 画面切换点天然落在语音停顿上。
  # （曾有个 granularity 开关只写在配置里、代码从未实现，已移除。）

# ---------- 6. 配图 ----------
images:
  # ---- 版权策略（这是配图的第一原则）----
  #   clean  只用版权干净的图库（默认）：博物馆/美术馆开放接口（CC0 / 公共领域）
  #          与免费商用图库（Unsplash / Pexels）。**不会出现版权未明的图。**
  #   mixed  干净图库优先，找不到才退回关键词检索（cn.bing.com 的图版权未明，
  #          有被追偿的风险 —— 只在赶时间、且自己能判断风险时用）
  # 实测（2026-09，国内网络）：无 key 且能直连的公共领域源只有下面三家博物馆；
  # Openverse 超时、美国国会图书馆被 Cloudflare 拦、Wikimedia Commons 不可达。
  license_policy: "clean"
  # 参与检索的图源。带 key 的在没配 key 时自动跳过，不影响运行。
  #
  # ⚠️ 默认只有 cleveland 一个，这是**实测**的结果（2026-09，国内网络），
  #    「搜得到」不等于「下得动」—— 下面每个源都实际拉过图测过速度：
  #   cleveland  克利夫兰艺术博物馆 CC0，317 KB/s ✅ 带年代字段，可按时年代匹配，主力
  #   pexels     Pexels 免费商用，233 KB/s ✅ 但需 PEXELS_API_KEY，且是现代摄影
  #   unsplash   Unsplash 免费商用，33 KB/s 🟡 需 UNSPLASH_ACCESS_KEY，同是现代摄影
  #   met        大都会 CC0，搜索正常但图服务器只有 **20 KB/s** ❌ 一张要几分钟，已排除
  #   artic      芝加哥艺术馆 公共领域，搜索结果正常但图床一律 **403** ❌ 已排除
  #   si/rijks   需 key，未测（国内能否直连未知）
  #   bing       版权未明，仅 mixed 模式参与
  # 想换/加源：改这一行即可；配了 key 之后把名字加进来就会生效。
  # 建议先跑 `run.bat probe-images --download` 量一遍真实下载速度再决定。
  providers: ["cleveland", "pexels", "unsplash"]
  # 每个分镜最多试几个检索词（LLM 会给 1-3 个）
  max_queries_per_scene: 3
  # 每路检索取多少候选
  candidates_per_query: 30
  # ---- 场景级英文检索词 ----
  # true：写稿后、配图前，多花一次便宜的 LLM 调用，把每个分镜的中文检索词翻成
  #       博物馆索引能命中的英文词（「清代 铜钱 串钱」→ "Qing dynasty copper coins"）。
  #
  # 背景：中文检索词只发给 bing，而 clean 策略下 bing 不参与 —— 所以不翻译的话，
  #   每个分镜自己的检索词是完全**空转**的（实测 18/18 配图来自英文词、中文 0 命中）。
  #
  # ⚠️ 但实测（2026-09，同一期 18 个分镜 A/B）这个开关**只是很小的改善**，不是解法：
  #     有候选的分镜：不翻译 0/18 → 翻译后 2/18
  #   原因在图源侧，不在检索词侧 —— 克利夫兰的索引对具体题材几乎是空的：
  #     "Ming dynasty painting"                  → 30 条（泛词，命中多）
  #     "Qing dynasty painting peasant farming"  → 0 条
  #     "Qing dynasty copper coins"              → 1 条
  #     "Qing dynasty painting porridge relief"  → 0 条
  #   所以「把词写得更具体」方向是错的：越具体越搜不到，最终仍然退回泛词，
  #   于是「要找清代铜钱」被配成一支明代斗彩婴戏杯（已按全分辨率确认）。
  #
  # 结论：图库路线的天花板就在这里，题材贴合真正的解法是**生成配图**
  #   （MiniMax image-01；实测该模型名有效，但当前 key 返回 1008 余额不足）。
  #   本开关保留打开：它是严格增量（多出来的候选确实更贴题），且随时可关。
  translate_scene_queries: true
  # ---- AI 生成配图（主力方案，图库作兜底）----
  # true：每个分镜先用 MiniMax image-01 按该分镜的检索词生成一张配图；
  #       生成失败（额度/限流/接口异常）自动退回下面的图库检索，不会因此没图。
  # 为什么改用生成：图库的天花板已实测到顶 —— 克利夫兰索引对具体题材几乎是空的
  #   （"Qing dynasty copper coins" 仅 1 条、"…porridge relief" 0 条），
  #   只有「时代+泛画种」宽词能命中，于是「要找清代铜钱」被配成明代斗彩婴戏杯；
  #   而生成图的提示词就是分镜内容，且没有第三方版权。
  # 实测：出图约 24-27 秒/张（18 个分镜并发 4 路 ≈ 2 分钟）。
  generate: true
  generate_model: "image-01"
  # 画幅。同一张图会被竖屏/横屏各自裁切使用，所以取竖屏优先的 3:4 折中；
  # 若只出竖屏可改 "9:16"，只出横屏可改 "16:9"。
  generate_aspect: "3:4"
  # ⚠️ 后缀的用词是**实测调出来的**，别随手改回「工笔/绢本/古画」：
  #   同一分镜（清代铜钱）三种后缀对照实验（2026-09-14）：
  #     A 「中国工笔风俗画风格，绢本设色…不要文字印章」→ 仍出现竖排乱码题字 + 红印章 ✗
  #     B 静物特写（当前用的这条）              → 没有印章/题跋/水印 ✓
  #     C 「博物馆藏品写实摄影…」                → 反而出现图库式水印（图虫创意）✗
  #   结论：「工笔/绢本」会诱发模型模仿书画题跋（题字+印章），
  #         「摄影」会诱发图库水印 —— 两头都别用，就用「器物静物」这种中性描述。
  generate_style_suffix: "中国古代器物静物特写，暖光，浅景深，质感真实，色调灰暗克制，整幅画面只有器物本身，不要任何文字、印章、署名、水印、边框，不要仿照书画题跋的排版"
  # ---- 人物/场景类分镜用这一条（第二条后缀）----
  # 为什么必须分两套：上面那条写死了「整幅画面只有器物本身」——
  #   它确实压掉了伪题字和红印章，但也会把**叙事分镜**一起拉成静物小品。
  #   第 7 期 18 张全部由上面那条生成，实测后果：
  #     要找「唐代长安城坊市布局图 坊墙坊门遗址」→ 给了一张干裂土地纹理
  #     要找「明代京城巡夜兵丁古画」            → 给了灯笼 + 木杖
  #     要找「清代衙门审案场景」                → 给了**一把西式法槌**（时代错乱）
  #   所以按分镜类型分派：器物/文书类走静物向，人物/场所类走这一条。
  #
  # 这一条的用词约束与上面一致：不写「工笔/绢本」（会诱发书画题跋），
  #   不写「摄影」（会诱发图库水印），并把文字/印章/署名/水印/匾额列成负面清单。
  #   额外加了「不要书页、碑文、匾额文字」—— 讲律法/文书的分镜很容易引出这些。
  generate_style_suffix_scene: "中国古代历史题材的叙事画面，以人物与场景为主体，中景或全身构图，真实质感，暖光侧照，浅景深，色调灰暗克制，不要任何文字、印章、署名、水印、边框，不要仿照书画题跋的排版，不要书法题字，不要落款，不要画面里出现书页、碑文或匾额文字"
  # 分镜画面类型判定（object=器物静物 / scene=人物场景）：
  #   先按关键词规则兜底，再用一次便宜的 LLM 调用覆盖；任何异常都退回规则值。
  #   判错不会没图，最坏是这条分镜用错了另一套后缀。关掉则全部按器物向处理。
  classify_scene_kinds: true
  # AIGC 水印：MiniMax 可在图上加 AI 生成标识。默认关（自己的片子不需要）。
  # ---- 复用已有配图（2026-09-17 加）----
  # true：data/images/scene_XXX.jpg 已存在、且**提示词跟上次一模一样**时直接复用，
  #       不再调 image-01 重新生成。背景：每重渲一次就把 18 张图重烧一遍
  #       （约 10 分钟 + 相应额度），而重渲通常只是想换个开场白/布局。
  #       提示词变了（换画风/换类型后缀）会自动重出；想强制重出用 --force。
  reuse_existing: true
  generate_aigc_watermark: false
  generate_timeout: 300
  # ---- 兜底检索词 ----
  # 实测：分镜自己的检索词太具体时（"market town"/"workshop"），馆里根本没有对应
  # 藏品，会整段没图。这时用「时代 + 泛画种」再搜一轮 —— 讲明末的段落配一幅
  # 明代山水/风俗画，比一个渐变底图强得多。
  fallback_queries: ["明代 古画", "中国古代 风俗画", "古代 生活场景 古画"]
  fallback_queries_en: ["Ming dynasty painting", "Chinese genre painting figures",
                        "Chinese album painting landscape"]
  # ---- 「美术作品向」优先 ----
  # 历史题材里一幅古画/文物比景区照片合适得多。这个偏好由代码里的 _ART_MARKERS
  # 与下面的 prefer_page_keywords 一起实现。
  # （早先还有一路「检索词 + 后缀（古画/文物）」的补充检索，已废弃并移除配置。）
  # 落在这些站点上的结果降权（旅游/素材/壁纸站，以及 AI 生成图库 ——
  # 实跑搜「函谷关遗址」拿到过带电线杆的现代景区照；
  # 搜「明代城墙」拿到过昵图网的 AI 生成图，画面上还印着 AIGC 水印）。
  # 只有优选组全灭时才会用它们。
  drop_page_keywords: ["qunar", "ctrip", "trip", "travel", "旅游", "门票", "攻略",
                       "酒店", "线路", "sucai", "素材", "壁纸", "模板", "摄图",
                       # 素材图库 / AI 生成图库（历史题材最忌讳这两类）
                       "nipic", "昵图", "58pic", "千图", "包图", "觅知", "veer",
                       "pngtree", "ooopic", "zhitu", "qiantu", "55.la",
                       "aigc", "ai生成", "ai绘画", "ai作图", "即梦", "jimeng",
                       "midjourney", "doubao", "豆包", "文心一格",
                       # 新闻门户：它们的图几乎都打了自家水印，
                       # 而「成片里不出现别家站名」是硬要求（实测拿到过长江网水印的图）
                       "sina.com", "sina.cn", "ifeng.com", "guancha.cn", "sohu.com",
                       "163.com", "qq.com", "toutiao", "baijiahao", "thepaper",
                       "长江网", "澎湃", "百家号", "观察者"]
  # ---- 优先站点：博物馆 / 档案馆 / 美术馆 / 拍卖行 / 古籍库 ----
  # 这些来源的图通常没有水印，且年代与器物信息可靠（实测国博、昆明博物馆、
  # 雅昌拍卖的图干净可用）。命中这些关键字的候选排在同类最前面。
  prefer_page_keywords: ["chnmuseum", "dpm.org", "dpm.org.cn", "artic.edu", "metmuseum",
                         "artron", "nlc.cn", "ctext", "shuge", "kaogu", "ncha",
                         "museum", "博物馆", "博物院", "美术馆", "图书馆", "档案馆",
                         "院藏", "馆藏", "藏品", "出土", "文物局", "考古"]
  # ---- 文化圈过滤（博物馆图源的必需项）----
  # 博物馆接口是关键词匹配：版权再干净也可能离题 —— 实测搜
  # "Ming dynasty painting city wall" 时，芝加哥艺术馆返回了《大碗岛的星期天》，
  # 大都会返回了波斯手抄本。讲明代故事的片子里放一张莫奈，比放现代照片还糟。
  # 默认只保留中国相关作品；讲日本/欧洲故事时把 culture_keywords 换掉即可。
  culture_filter: true
  culture_keywords: ["Chinese", "China", "中国"]
  # 大都会的搜索只给 objectID，每件要再请求一次详情 —— 不限部门的话一个检索词
  # 能拖掉几分钟。6 = Asian Art（亚洲艺术部），讲中国题材时用它最省时也最准。
  met_department_id: 6
  met_max_objects: 9        # 最多拉多少件详情（每件都是一次额外请求）
  met_max_results: 6        # 一个检索词最多采用几件（再多也没用，只会拖时间）
  timeout_detail: 12        # 详情请求超时（秒），比主超时短一些
  # 单张图体积上限（MB）。博物馆原图常有大几十 MB 的，画布最多 4K，超限直接跳过
  max_mb: 25
  # 单张图下载耗时超过这个秒数就在日志里提示（慢图源会拖垮整期）
  slow_download_warn: 25
  # 分辨率门槛：低于这个尺寸的图不要（糊图放大了很难看）
  min_width: 700
  min_height: 480
  # 横向图优先（横屏版好看），但竖屏版会重新裁切，所以竖图也接受
  max_aspect: 2.6
  # 平均哈希去重：相似度低于这个汉明距离视为「同一张图」，不重复用
  dedupe_hamming: 6
  # 下载并发
  concurrency: 4
  timeout: 25
  # 场景图注旁边是否显示「版权｜出处」（如 CC0 公共领域｜克利夫兰艺术博物馆）
  # 公共领域与免费商用图库都不强制署名，打开后版权链路更清楚
  show_credit: false
  # 图源可用性会写入 data/images/_sources.json，方便排查
  # （找不到图时自动用生成的渐变底图兜底，不留空画面；没有开关，也不该有）

# ---------- 7. 视频输出 ----------
video:
  # 同时生成竖屏和横屏两种
  orientations:
    portrait:  { width: 1080, height: 1920 }
    landscape: { width: 1920, height: 1080 }
  fps: 30
  # 每个分镜的画面停留 = 语音时长 + 这个余量（秒），保证语音不被切断
  tail_padding: 0.55
  # 画面运动（把配图做成缓慢横移，静态图不会显得死）
  motion: true
  # 配图放大倍率：背景层按这个倍数放大再缓移，保证移动时不露黑边
  motion_scale: 1.16
  # ---- 品牌信息 ----
  channel_name: "历史小故事"
  intro_slogan: "一盏茶的时间，听一段旧事"
  # ---- 片头 / 片尾画面 ----
  # ⚠️ 代码读的键名是 intro / outro（pipeline.render_orientation 里的 v.get("intro") /
  #    v.get("outro")）。原先进位是「outro_card」，那个名字代码从来不读 —— 是个假开关，
  #    所以关不掉片尾。已改为下面这个真正生效的键名。
  intro: true
  outro: true
  # 转场：章节之间淡入淡出到黑（fade），同一个章节内的分镜硬切
  transition: "fade"          # fade | none
  transition_seconds: 0.4
  # 编码参数
  video_codec: "libx264"
  preset: "medium"
  crf: 20
  # 音轨编码。播放器放不出声音时，多半是系统缺 AAC 解码器，
  # 按 aac → libmp3lame → ac3 顺序换。
  audio_codec: "aac"
  audio_sample_rate: 48000
  audio_bitrate: "192k"
  # 无图时的兜底背景色
  fallback_bg: "0x101820"
  # ---- 封面图（发布用缩略图）----
  # 每个朝向各出一张 <日期>_<标题>_<竖屏/横屏>_封面.jpg，和成片同目录。
  # 组成：第一张分镜配图压暗当底 + 栏目名（顶部）+ 大标题（中部，字号自适应）
  #       + 本期问题/年代（标题下）+ slogan（底部）。
  cover: true
  # 封面底图压暗程度（0-0.85）。封面标题比画面上的字大，要压得更暗才压得住图
  cover_darken: 0.10
  # ---- 封面的橙色风格（用户 2026-09-16 指定）----
  # 底图不管是冷色还是彩色，一律按 cover_tint_alpha 往橙色拉一遍，
  # 整套封面统一成橙色系，更像一个栏目的片子（不是每期颜色都不一样）。
  cover_base: "#C07020"          # 无配图时的渐变底色（明亮暖橙）
  cover_tint: "#F0A22A"          # 色调统一的橙黄（2026-09-17：要更明亮）
  cover_tint_alpha: 0.78         # 往橙色拉的强度（0=不拉，1=全橙）
  # ⚠️ 实测：0.46 时真实封面（底图偏冷的那几张）均色 R-B 只有 36，
  #    差一点过不了「R-B>40」的判据 —— 合成图测得出、真实图差一口气，
  #    所以把强度提到 0.54 留出余量。
  cover_scrim: "#2A1405"         # 压暗/遮罩的暖色（别用纯黑，会把橙色拉回冷调）

  # ---- 关键词（大字标注）的位置：默认画面左上角 ----
  # 原来压在画面正中，会挡住素材主体（观众要看的人脸/朝堂恰好在中间）。
  callout_align: "left"          # left（左上角）| center（旧的居中样式）
  callout_cx: 0.06               # 左边缘位置（left 时的左边界）
  callout_cy: 0.135              # 垂直中心
  callout_max_width: 0.62        # 最多占画面宽度的比例（超了自动缩字号）
  # 章节标题区（关键词占了左上角，标题往下让位，两者都在上三分之一里）
  title_top: 0.20
  title_bottom: 0.38

# ---------- 8. 字幕 ----------
subtitle:
  enabled: true
  font_name: "Microsoft YaHei"
  font_size_portrait: 52
  font_size_landscape: 46
  max_chars_per_line: 18
  max_lines: 2
  primary_color: "&H00FFFFFF"
  outline_color: "&H00000000"
  outline: 3
  shadow: 1
  # 字幕垂直位置（0=顶部,1=底部）。必须和 media.build_layers 的 subtitle_zone 对齐
  margin_v_ratio: 0.88
  bottom_bar: true
  # （压暗条透明度写在 subtitles.build_ass 的 &H73 前缀里，约 45%，没有独立开关）

# ---------- 9. 背景音乐 ----------
# 版权说明：只用免版权可商用的曲子（如 Mixkit Free Music）。
#          不要用有版权的影视/节目配乐 —— 公开发布有侵权风险。
bgm:
  enabled: true             # 2026-09-14 打开
  file: "data/bgm/story_bed.mp3"
  # 音量：0.08 偏低是刻意的 —— 这是垫底背景音，人声必须始终清楚
  volume: 0.08
  # after_intro = 开场白念完（含片头口播）才淡入，不要在开头就铺。
  # 这是用户明确要求过的：片子一上来就铺音乐会盖住开场那几句。
  start_mode: "after_intro"  # immediate | after_intro | custom
  start_at: 0.0
  start_padding: 0.4
  fade_in: 2.5
  fade_out: 4.0
  # 曲子只有 118 秒，成片 7-9 分钟 → 必须循环铺满（-stream_loop -1）
  loop: true
  # ---- 当前曲目（2026-09-14 换成舒缓向）----
  #   Meditation ／ Arulo ／ Ambient ／ mixkit 免费音乐库
  #   许可：Mixkit Stock Music Free License（可商用、免署名；不可转售素材本身）
  #   时长 118.1s ／ 256kbps ／ 全曲 mean_volume -10.7 dB
  #
  #   选它的依据（12 首候选实测，脚本：data/tmp/pick_bgm.py + bgm_pulse.py）：
  #     · 频谱质心 751Hz —— 12 首里最低（越低越闷、越柔）
  #     · 高频段（>4kHz）比全带低 31.8 dB —— 几乎没有沙锤/镲片那种高频毛刺
  #     · 峰-均差 9.8 dB —— 最小，意味着不会有突然的渐强把旁白压住
  #     · 包络波动率 σ/μ = 0.178 —— 12 首里最平
  #     · 脉冲 1 次/分 —— 几乎没有鼓点（对照：Music_Vastness 37 次/分）
  #   ⚠️ 视觉模型在频谱图上把 Voxscape 判成「最干净」，数值一量它有 21 次/分脉冲。
  #      这类判断以数值为准 —— 频谱图看形状可以，下结论不行。
  #
  # ---- 换曲子 ----
  #   只需替换 data/bgm/story_bed.mp3 这个文件，配置不用动。
  #   旧曲已归档：data/bgm/archive/story_bed_v1_Motivating_Mornings.mp3
  #   （运动/励志向，与历史题材气质不合，当初只是「接线验证用」）
  #   来源与许可留痕见 data/bgm/来源与许可.md

  # ---- 多曲交替：一期视频里按章节轮换多首 BGM（2026-09-15 新增）----
  # 用法：files 里按顺序排，第 i 章用 files[i % 首数]，章与章之间交叉淡化。
  # 6 章 + 3 首 → 第 1、4 章第一首，第 2、5 章第二首，第 3、6 章第三首。
  #
  # ⚠️ 交替之前**必须**归一化响度，这一步程序会自动做，但你要知道为什么：
  #    候选曲之间的录制电平能差 20 dB（实测候选 3 Relax Beat 整轨 mean_volume
  #    -33.0 dB、候选 8 Voxscape -12.8 dB）。不归一化，低电平那首在 0.08 音量下
  #    等于静音 —— 听感就是「音乐放到那一章突然消失了」。
  #    做法：EBU R128 两遍法，统一拉到 loudness 指定的 LUFS；
  #    归一化结果缓存在 data/bgm/bed/norm/，拼好的轨缓存在 data/bgm/bed/，
  #    同一套曲子 + 同一段时间轴只算一次（竖屏/横屏共用）。
  #
  # 换曲目：把 files 换成你想轮换的那几首即可（路径相对项目根目录）。
  # 关掉交替、回到单曲：playlist.enabled: false（或删掉这一段）。
  playlist:
    enabled: true
    files:
      - "data/bgm/playlist/01_relax_beat.mp3"
      - "data/bgm/playlist/02_sleepy_cat.mp3"
      - "data/bgm/playlist/03_voxscape.mp3"
    crossfade: 2.5          # 章与章之间的交叉淡化秒数（硬切在闷垫↔亮垫之间会咔一下）
    loudness: -18.0         # 统一响度目标（LUFS）

# ---------- 10. 影视切片素材库 ----------
# 用途：历史解说视频的影视切片背景。
# 详见 docs/plans/2026-09-15-历史解说视频v1-影视切片.md
# 素材由人工剪辑 + 打标签后导入（v1 不做自动视频索引，那是独立工程）。
#
# ⚠️ 合规硬线（这几条是给公开发布兜底的，别放宽）：
#   · max_seconds：单段要短。长段引用更接近"搬运"，短段更接近"引用"
#   · 必须去音轨（导入工具强制 -an）：不用原声，且我们有自己的配音
#   · max_share：成片里切片总时长占比上限，超了拒绝出片
#   · 每条素材必须记 title/year/people 等来源字段，发布前出「素材出处清单」
clips:
  # ★ false = 一律不引用影视切片（用户 2026-09-17 定：镜头全部用 AI 生成图）：
  #   EDL 里不会再出现 clip/reuse，切片占比恒为 0。想回到"切片 + 生成图"混排改回 true
  #   （素材库还在 data/clips，没删）。
  enabled: false
  dir: "data/clips"
  index: "data/clips/index.json"
  max_seconds: 10        # 单段时长上限（秒）
  max_share: 0.45        # 切片总时长占成片比例上限
  fit: "blurpad"         # 素材铺画布的方式：blurpad（模糊底+完整画面，竖屏发横屏首选）| cover（裁满）
  spec:                  # 规范化目标规格（导入时统一转成这个）
    width: 1920
    height: 1080
    fps: 30

# ---------- 10.2 剪辑决策（EDL）----------
# EDL = 编辑决策文件：第几秒用哪条素材的哪一段、什么手法、打什么字。
# 由一次 LLM 调用（AI 导演）产出，渲染层照它执行（见 src/hsg/edl.py）。
edl:
  freeze_zoom: 1.55      # 「定格放大」的默认放大倍数（1.0-3.0，再大就糊）
  allow_era_match: false # 只认显式绑定槽位的素材。改 true 会拿「同年代搜到的」顶替
                         # 没剪素材的分镜 —— 等于替你做创作/版权决策，还会顶穿切片占比红线
                         # （实测 97.7% > 45%）。除非你明确要，否则别开。

# ---------- 10.5 素材需求清单 ----------
# 用途：把脚本分镜翻译成「要去剪什么片段」的工作单（脚本先行：清单在剪素材之前出）。
# 工作流：run plan -t "题材" → make_needs.py 出清单 → 你按单剪片 → import_clip.py 导入 → 渲染。
#
# 槽位粒度是按「单个片段」切的，不是按分镜：一个分镜 22 秒、单段上限 10 秒，
# 就必须切成 3 段（s04_sh1/sh2/sh3），每段 7 秒左右。
needs:
  slot_seconds: 8.5      # 单槽位目标时长（必须 ≤ clips.max_seconds）
  # 取景单（阶段 1 顺带产出）：为「必须剪」的槽位列候选片源 + 检索式。
  # 候选片源是模型给的、**未核实**（它对集数/时间码会编），集数与时间码由你在正片里确认。
  # 最多为几处必须剪的镜头出取景单（多了浪费 token、也淹没重点）
  sources_max_slots: 12
  min_shot_seconds: 4.0  # 均分后低于这个值就少切一刀（免得一堆 2 秒碎片）
  must_if_chapter_start: true   # 章节开场那一镜算关键位置（优先级只认这一条）
  long_scene_seconds: 30 # 分镜超过这个时长 → 找不到素材时用 AI 生成而不是静态图
  # ★ 优先级只落在每个分镜的**第 1 段**上：同场戏的后几段复用同一段素材，
  #   所以标「↺ 复用」而不是「必须」。全标必须 = 没有优先级（踩过两次）。
  # ★ 别把「长分镜」加进优先级判据：plan 阶段估出来普遍 ~31 秒，阈值落在噪声带里，
  #   会把每一场都标成必须。长分镜影响的是**回退方案**，见 long_scene_seconds。

# ---------- 10.7 四格漫画素材（2026-09-17 新增，用户点子）----------
# 用途：把「手工抓影视切片」换成「按槽位生成四格漫画」。
#   路线：run.bat comic（扩写旁白 → image-01 出四格 → 出提示词清单）→ 渲染按四格铺镜头。
#
# 为什么四格必须在**一张图**里（comic.layout 是 2x2，不是分开出四张）：
#   四格的灵魂是「格与格之间人物长得一样」。分开生成四次，人物/服装/光线必然飘
#   （配图那轮实测：同一期 18 张里同一个人物换过脸），一张图一次成稿才共享同一套设定。
#
# 为什么出图前要先扩写（comic.expand_prompt）：
#   槽位描述本来就短（「汉武帝病榻前，霍光跪受周公负成王图，中景，殿内昏暗…」），
#   直接丢给模型会得到一张"概括图"；扩写成四拍（起/承/转/合）+ 一句统一设定之后，
#   模型才有足够信息画出"同一场戏的四个瞬间"。
comic:
  enabled: true             # ★ true = 有漫画图的槽位用四格漫画（2026-09-17 定）；没出图的槽位仍用生成配图
  model: "image-01"
  layout: "2x2"             # 2x2 | 1x4 | 4x1（一张图里的格子排布）
  aspect: "1:1"             # 出图纸张画幅（2x2 时每格是正方形）
  mode: "panels"            # panels（一格一格轮流上屏，每格占 shot/N）| sheet（整张一起展示）
  # 漫画格铺满画布的方式。**必须 blurpad**：格子是方形、画布是 16:9/9:16，
  # cover 会裁掉格子的上下（实测把人物头部和卷轴下端切掉了）。
  fit: "blurpad"
  expand_prompt: true       # 出图前先让 LLM 把槽位描述扩写成四拍（用户明确要求）
  style: "中国古代连环画风格（小人书），白描线稿加淡彩，人物比例写实，衣冠器物考据，中景与近景交替"
  # ⚠️ 负面清单里「对白气泡、拟声词」是必须点名的：漫画题材最容易长出气泡和"咚/哗"，
  #    而我们要的是画面（旁白在字幕里，画面再冒字就重了）。
  negative: "整幅画面不要任何文字、对白气泡、拟声词、印章、署名、水印、边框花边，不要仿照书画题跋的排版，不要分镜编号"
  dir: "data/comics"
  timeout: 300

# ---------- 11. 路径 ----------
paths:
  data_dir: "data"
  material_dir: "data/material"   # 检索素材
  image_dir: "data/images"        # 配图
  audio_dir: "data/audio"         # 语音
  slide_dir: "data/slides"        # 合成画面
  segment_dir: "data/segments"    # 分镜片段
  output_dir: "data/output"       # 成片
  temp_dir: "data/tmp"

# ---------- 11. 运行时 ----------
runtime:
  log_level: "INFO"
  # 中间产物（画面/音频/片段）一律保留：用户要求保留调试脚本和旧产物，不做自动清理。
  # （曾有个 keep_intermediate 开关，代码从未读它 —— 已移除。）
  # 跑完在控制台打印时长统计的明细表
  print_timeline: true
  # ---- 生成记录 / 选题去重 ----
  # 每次跑完追加一条记录到 data/history.json（人看的是同目录 生成记录.md），
  # 并据此查重：
  #   · 不带 -t 自动选题时，跳过已经做过的题材（池子挑完了就让模型出一个新题）
  #   · 带 -t 指定了做过的题材 —— 直接拦下并提示，除非加 --allow-duplicate
  record_history: true
