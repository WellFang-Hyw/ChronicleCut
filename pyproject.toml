[project]
name = "historical-story-gen"
version = "0.1.0"
description = "历史小故事 → DeepSeek 写稿 → TTS 配音 → 配图字幕 → 成片"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# 免费兜底语音（MiniMax 挂了才用）
edge = ["edge-tts>=6.1"]

[project.scripts]
hsg = "hsg.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
